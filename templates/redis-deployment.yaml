apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ckan.fullname" . }}-redis

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ckan.fullname" . }}-redis

  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ckan.fullname" . }}-redis

    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"

          args:
            - redis-server
            - --appendonly
            - "yes"

          ports:
            - name: redis
              containerPort: 6379

          volumeMounts:
            - name: redis-data
              mountPath: /data

      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: {{ include "ckan.fullname" . }}-redis